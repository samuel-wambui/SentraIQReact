services:
  postgres:
    image: postgres:16-alpine
    container_name: sentraiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-senctra_iq}
      POSTGRES_USER: ${POSTGRES_USER:-samuel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sentraiq-postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: sentraiq-backend:latest
    container_name: sentraiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-senctra_iq}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-samuel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8082}:8081"

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE: ""
    image: sentraiq-frontend:latest
    container_name: sentraiq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-83}:80"

volumes:
  sentraiq-postgres-data:
